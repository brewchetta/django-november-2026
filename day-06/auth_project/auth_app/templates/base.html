<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth</title>
</head>
<body>
    
    <nav>
        <a href="{% url 'home' %}">Home</a>

        <!-- links if a user is logged in -->
        {% if request.user.is_authenticated %}
            <a href="">{{ user.username }}'s Profile</a>
            <a href="">Logout</a>

        <!-- links if a user is logged out -->
        {% else %}
            <a href="{% url 'signup' %}">Signup</a>
            <a href="">Login</a>

        {% endif %}
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
