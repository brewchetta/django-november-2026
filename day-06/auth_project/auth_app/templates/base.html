<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth</title>
</head>
<body>
    
    <nav>
        <a href="{% url 'home' %}">Home</a>

        <!-- links if a user is logged in -->
        {% if request.user.is_authenticated %}
            <a href="{% url 'music_create' %}">Add New Music</a>
            <a href="{% url 'music_mine' %}">Your Music</a>
            <a href="{% url 'profile' %}">{{ user.username }}'s Profile</a>
            <a href="{% url 'auth_logout' %}">Logout</a>

        <!-- links if a user is logged out -->
        {% else %}
            <a href="{% url 'auth_signup' %}">Signup</a>
            <a href="{% url 'auth_login' %}">Login</a>

        {% endif %}
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
