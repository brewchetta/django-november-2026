{% extends 'base.html' %}
{% block content %}

<div>
    <p>
        Username: {{ request.user.username }}

    <p>
        Email: {{ request.user.email }}
    </p>
    <p>

    </p>
    <p>
        Bio: {{ request.user.profile.bio }}
    </p>

        Favorite Artist: {{ request.user.profile.favorite_artist }}
    </p>
</div>

{% endblock %}
